# Commu Web (DEPLOYMENT 1.1·3.2). 비루트 nginx, 8080. 화면은 /commu/ 아래 — Cloudflare 터널이 stories.devple.net의 ^/commu(/|$)만 보낸다
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # 리다이렉트 Location을 상대 경로로 (터널 뒤에서 http://…:8080이 새지 않게)
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # k8s 프로브 (클러스터 내부 전용)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /commu {
        return 301 /commu/;
    }

    # Vite 해시 파일: 내용이 바뀌면 이름이 바뀐다
    location ^~ /commu/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable"; # 2xx·3xx에만 (404를 1년 캐시하지 않게)
        try_files $uri =404;
    }

    # 해시 없는 정적 파일(favicon 등): 없으면 404 (HTML로 폴백하지 않는다)
    location ~* ^/commu/.+\.(?:js|css|map|json|png|svg|ico|woff2|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: /commu/ 아래 그 밖의 경로는 index.html (항상 새로 확인)
    location /commu/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /commu/index.html;
    }

    # 그 밖 전부(/, /api/*) 404 — 여기까지 왔다면 터널 라우팅 오류다. index.html로 폴백하지 않는다
    location / {
        return 404;
    }
}
