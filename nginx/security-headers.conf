# 모든 응답의 보안 헤더 (DEPLOYMENT 3.2). add_header는 location에 하나라도 있으면 상위 것을 물려받지 않으므로 location마다 include한다.
# CSP는 첫 배포에서 Report-Only로 내보내 위반이 없는지 확인한 뒤 Content-Security-Policy로 바꾼다
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
