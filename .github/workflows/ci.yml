# CI (CONVENTIONS 9장, GRAPHICS 8장): main 푸시·PR마다 정적 검사 · 단위 테스트(domain 커버리지 100%) · 자산 검수.
# E2E(Playwright)는 아직 넣지 않는다 — 로컬 `pnpm test:e2e` (2026-10-01 사용자 결정 A)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # pnpm 버전은 package.json packageManager (pnpm 12는 6.1+ 필요). store를 pnpm-lock.yaml 해시로 캐시
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm check:assets
